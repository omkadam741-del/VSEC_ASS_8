
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Student Portal</a>

            <div class="navbar-nav">
                <a class="nav-link active" href="#home">Home</a>
                <a class="nav-link" href="#students">Students</a>
                <a class="nav-link" href="#form">Add Student</a>
            </div>
        </div>
    </nav>

    <div class="container my-5" id="home">
        <h1 class="text-center mb-4">Student Management System</h1>

        <!-- Student Table -->
        <h3 id="students">Student Records</h3>

        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead class="table-primary">
                    <tr>
                        <th>Roll No.</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Amit</td>
                        <td>IT</td>
                        <td>amit@example.com</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>om</td>
                        <td>Computer</td>
                        <td>om@example.com</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Rahul</td>
                        <td>ENTC</td>
                        <td>rahul@example.com</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Student Form -->
        <div class="card shadow-sm mt-5" id="form">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Add Student</h3>
            </div>

            <div class="card-body">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Student Name</label>
                        <input type="text" class="form-control"
                               placeholder="Enter your name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control"
                               placeholder="Enter your email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Roll Number</label>
                        <input type="number" class="form-control"
                               placeholder="Enter roll number" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Course</label>
                        <select class="form-select" required>
                            <option value="">Select Course</option>
                            <option>IT</option>
                            <option>Computer</option>
                            <option>Mechanical</option>
                            <option>Civil</option>
                            <option>ENTC</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Submit
                    </button>
                    <button type="reset" class="btn btn-secondary">
                        Reset
                    </button>
                </form>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center p-3">
        Student Management System | Assignment 2
    </footer>

</body>
</html>
